# Audiobookshelf password guessing (J25). ABS has NO login throttling of its own and its
# /login must stay outside Authelia so the mobile apps can sign in, so the edge rate limit
# (15 POSTs/min per IP) was the only defence: ~21k guesses a day from one address.
#
# Scoped to the audio.<domain> vhost on purpose: every other app's POST /login is already
# counted by the stricter caddy-auth jail, and only Audiobookshelf answers a wrong password
# with 401 on this path. @@DOMAIN@@ is substituted (dots escaped) by bookstack.sh's
# render_fail2ban. Keyed on "client_ip" — behind Cloudflare "remote_ip" is the edge, not the
# visitor — so the ban lands on the real address via the cloudflare-token action.
#
# A Caddy JSON access-log line orders the fields client_ip ... method ... host ... uri ... status.
[Definition]
failregex = "client_ip":"<HOST>".*?"method":"POST".*?"host":"audio\.@@DOMAIN@@(?::\d+)?".*?"uri":"/login(?:\?[^"]*)?".*?"status":401
ignoreregex =
# Caddy stamps each line with a float epoch ("ts"). Without this, fail2ban finds no date and
# falls back to the read time, so findtime windows drift when it catches up on a rotated log.
datepattern = "ts":{EPOCH}
