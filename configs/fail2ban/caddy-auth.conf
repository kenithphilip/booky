# Failed logins seen by Caddy (JSON access log). Behind Cloudflare the connecting address
# ("remote_ip") is Cloudflare's edge; the real visitor is "client_ip" (Caddy's
# trusted_proxies cloudflare). Only POSTs to login endpoints count — a plain 401 is also what
# every OPDS reader app receives as its normal Basic-auth challenge, so those must NOT count.
#   portal:    POST /login            -> 401 on a wrong password
#   Shelfmark: POST /api/auth/login   -> 401
#   Authelia:  POST /api/firstfactor  -> 401
[Definition]
failregex = "client_ip":"<HOST>".*?"method":"POST".*?"uri":"/(?:login|api/auth/login|api/firstfactor)(?:\?[^"]*)?".*?"status":401
ignoreregex =
