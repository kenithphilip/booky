# Failed logins seen by Caddy (JSON access log). Behind Cloudflare the connecting address
# ("remote_ip") is Cloudflare's edge; the real visitor is "client_ip" (Caddy's
# trusted_proxies cloudflare). Only POSTs to login endpoints count — a plain 401 is also what
# every OPDS reader app receives as its normal Basic-auth challenge, so those must NOT count.
#   portal:    POST /login            -> 401 on a wrong password   (request.<domain>)
#   Shelfmark: POST /api/auth/login   -> 401                       (shelf.<domain>)
#   Authelia:  POST /api/firstfactor  -> 401                       (auth.<domain>)
#
# Scoped to those three vhosts. Unscoped, this filter also matched audio.<domain> POST /login,
# so the stricter jail (8 in 5 min -> 2 h) fired before the deliberately looser Audiobookshelf
# one (caddy-abs-login, 10 in 10 min -> 1 h) ever could: an ABS app holding a stale password
# retries on its own and banned the household's single NAT address out of all four sites.
# books.<domain> is absent on purpose: Calibre-Web answers a wrong password with 200 and the
# form again, never 401, so it can only contribute false positives.
# @@DOMAIN@@ is substituted (dots regex-escaped) by bookstack.sh's render_fail2ban, exactly as
# in caddy-abs-login.conf. A Caddy JSON line orders client_ip ... method ... host ... uri ... status.
[Definition]
failregex = "client_ip":"<HOST>".*?"method":"POST".*?"host":"(?:request|shelf|auth)\.@@DOMAIN@@(?::\d+)?".*?"uri":"/(?:login|api/auth/login|api/firstfactor)(?:\?[^"]*)?".*?"status":401
ignoreregex =
# Caddy stamps each line with a float epoch ("ts"). Without this, fail2ban finds no date and
# falls back to the read time, so findtime windows drift when it catches up on a rotated log.
datepattern = "ts":{EPOCH}
