# Password guessing against HTTP Basic auth on the device paths (OPDS readers, KOReader
# sync). Those paths bypass Authelia and the Browser Integrity Check by design, and CWA has no
# lockout for Basic auth, so this jail is the only throttle. A legitimate reader app produces
# ONE 401 per session (the challenge) and a mis-saved password a handful, hence the loose
# threshold in jail.local (30 in 10 min). Keyed on the real visitor (client_ip), like caddy-auth.
#
# TWO failregex lines, because KOReader's two endpoints answer a wrong password with DIFFERENT
# statuses and the 401-only filter counted just one of them. Measured against the pinned
# crocodilestick/calibre-web-automated:v4.0.6 with koreader_sync_enabled=1:
#   GET /kosync/users/auth           no creds -> 401 ; wrong pw -> 401 ; right pw -> 200
#   GET  /kosync/syncs/progress/<id> no creds -> 400 ; wrong pw -> 400 ; right pw -> 200
#   PUT  /kosync/syncs/progress      identical, and it is a WRITE
# cps/progress_syncing/protocols/kosync.py:532 raises KOSyncError(ERROR_UNAUTHORIZED_USER) and
# handle_sync_error() returns it with status 400, so an attacker had a clean password oracle
# that this jail structurally could not see: it never fired, no matter how many guesses. A hit
# yields that reader's Calibre-Web password, which is also their Shelfmark and (via
# librarian/absapi.py set_password) their Audiobookshelf password.
#
# Why a blanket 400 on /kosync is safe to count: every other 400 in that module is a malformed
# payload (ERROR_INVALID_FIELDS / ERROR_DOCUMENT_FIELD_MISSING - kosync.py:630-663), which a
# correctly configured KOReader does not produce; and when KOReader sync is OFF (the default,
# KOSYNC_ENABLED=false) the endpoints answer 503, not 400, so a disabled feature cannot ban
# anybody. Well inside maxretry 30 / findtime 10m either way.
# Scoped to /kosync on purpose: /opds answers a plain 400 for a malformed query string, which
# says nothing about a password.
[Definition]
failregex = "client_ip":"<HOST>".*?"uri":"/(?:opds|kosync)[^"]*".*?"status":401
            "client_ip":"<HOST>".*?"uri":"/kosync/(?:syncs|users)[^"]*".*?"status":400
ignoreregex =
# Caddy stamps each line with a float epoch ("ts"). Without this, fail2ban finds no date and
# falls back to the read time, so findtime windows drift when it catches up on a rotated log.
datepattern = "ts":{EPOCH}
