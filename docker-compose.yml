# Hardened book library stack. Managed by bookstack.sh — you rarely need to touch this.
#
# Network model
#   caddy            host network: public sites listen on BIND_IP (books, audio, request, shelf,
#                    auth; firewall admits only Cloudflare), admin sites (monitor, dl, ephemera)
#                    on the default listener but abort anything not from the tailnet (Caddyfile
#                    tailnet_only), so a missing tailnet IP can never stop the public sites.
#   librarian,       host network too (librarian: loopback to CWA/ABS, Caddy upstream;
#   uptime-kuma      Kuma: so its http://127.0.0.1:<port> monitors reach the services).
#                    Host-network processes can reach the admin's other tailnet devices when the
#                    tailnet policy allows it: the portal's download fence refuses 100.64.0.0/10
#                    and private ranges, and the Tailscale step should apply the tailnet ACL that
#                    gives this machine (tag:bookstack) no outbound access.
#   everything else  bound to 127.0.0.1 only; reachable solely through Caddy
#   qbittorrent      OPT-IN (profile "torrents", Library -> Torrents). Additionally opens 6881
#                    to the internet for peer traffic (that's all it exposes). Written as
#                    0.0.0.0:6881 on purpose: the Docker daemon's default publish address is
#                    127.0.0.1 (daemon.json, bookstack.sh step_system).
#
# Images are pinned through IMG_* in .env (bookstack.sh seeds them; Operations -> Update bumps
# them). The defaults here are the tags current on 2026-09-22, so compose renders with an
# empty .env too. Memory/PID fences are sized for a 4 GB host (README: on 8 GB multiply by 1.5).

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  caddy:
    <<: *common
    build: ./caddy
    image: bookstack/caddy:latest
    container_name: caddy
    network_mode: host
    mem_limit: 256m
    oom_score_adj: -500
    environment:
      # Least privilege: only the Zone:DNS:Edit token for ACME DNS-01 (CF_DNS_TOKEN; the
      # installer writes a copy of the main token when no separate one was given). The main
      # CF_API_TOKEN (zone settings, rules, firewall) stays on the host. The fallback keeps an
      # older .env without CF_DNS_TOKEN renewing certificates until Configure runs again.
      - CF_API_TOKEN=${CF_DNS_TOKEN:-${CF_API_TOKEN:-}}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/cf-origin-pull-ca.pem:/etc/caddy/cf-origin-pull-ca.pem:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    # Admin API lives on unix//run/caddy-admin.sock inside the container (Caddyfile global
    # options); nothing listens on 127.0.0.1:2019.

  calibre-web:
    <<: *common
    image: ${IMG_CWA:-crocodilestick/calibre-web-automated:v4.0.6}
    container_name: calibre-web
    # Calibre conversions fork several processes and peak high; the largest fence in the stack.
    pids_limit: 1024
    mem_limit: 1600m
    mem_reservation: 512m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./cwa/config:/config
      - ./library/ingest:/cwa-book-ingest
      - ./library/books:/calibre-library
    # The image ships a healthcheck (curl on :8083, 120 s start period). The portal and
    # Shelfmark authenticate against CWA's app.db, so they wait for it to be healthy —
    # Shelfmark in particular would run WITHOUT authentication if app.db did not exist yet.

  audiobookshelf:
    <<: *common
    image: ${IMG_ABS:-ghcr.io/advplyr/audiobookshelf:2.36.1}
    container_name: audiobookshelf
    user: "${PUID}:${PGID}"
    mem_limit: 768m
    mem_reservation: 256m
    environment:
      - TZ=${TZ}
      # Keep Node's heap under the container fence so a big library scan GCs instead of OOMing.
      - NODE_OPTIONS=--max-old-space-size=640
    ports:
      - "127.0.0.1:13378:80"
    volumes:
      - ./library/audiobooks:/audiobooks
      - ./library/podcasts:/podcasts
      - ./abs/config:/config
      - ./abs/metadata:/metadata
    healthcheck:
      # GET /healthcheck is a bare 200 in 2.36.1 (server/Server.js: router.get('/healthcheck',
      # (req, res) => res.sendStatus(200))) and needs no token. The image has no curl, but it
      # does ship /usr/bin/wget (both verified in ghcr.io/advplyr/audiobookshelf:2.36.1).
      # ABS listens on port 80 inside the container (published on 127.0.0.1:13378).
      # /healthcheck is a constant 200 that touches neither the database nor the library
      # (server/Server.js: res.sendStatus(200)), so it can only fail when the process is dead.
      # /status reports real state; "isInit":true is what scripts/selftest.sh already asserts,
      # and it goes through the database, so a corrupt absdatabase.sqlite now shows as unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/status | grep -q '\"isInit\":true'"]
      interval: 60s
      timeout: 10s
      retries: 3
      # A first scan of a big library keeps the event loop busy; don't flap during it.
      start_period: 60s

  qbittorrent:
    <<: *common
    # Opt-in: only started with `--profile torrents` (bookstack.sh adds it when
    # TORRENTS_ENABLED=true). It sees ONLY the user dropboxes: every finished download must sit
    # in a category whose save path is /dropbox/<cwa-user>, so the portal tags it owner:<user>
    # and ingests it (ebooks -> Calibre-Web, audiobooks -> Audiobookshelf). No direct mounts of
    # ingest/audiobooks/staging: those bypass owner tagging.
    profiles: ["torrents"]
    image: ${IMG_QBIT:-lscr.io/linuxserver/qbittorrent:5.2.3}
    container_name: qbittorrent
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    ports:
      - "127.0.0.1:8080:8080"
      - "0.0.0.0:6881:6881"
      - "0.0.0.0:6881:6881/udp"
    volumes:
      - ./qbt/config:/config
      - ./downloads/incomplete:/downloads/incomplete
      - ./library/dropbox:/dropbox

  librarian:
    <<: *common
    build:
      context: ./librarian
      args:
        # Baked into the image (ARG + ENV) so /healthz and /admin can show which checkout the
        # running portal was built from: a stale image is otherwise invisible. Deploy/Update
        # pass the git hash; a plain `docker compose build` gets "dev".
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: bookstack/librarian:latest
    container_name: librarian
    # Host network: reaches Audiobookshelf on 127.0.0.1 and is proxied by Caddy on 127.0.0.1.
    network_mode: host
    user: "${PUID}:${PGID}"
    # Graceful shutdown. The image's CMD now execs gunicorn (librarian/Dockerfile), so the
    # signal reaches it; init: true additionally puts docker-init (tini) at PID 1, which
    # reaps the short-lived children the worker forks (calibre/ffmpeg probes) instead of
    # leaving them to gunicorn. 30 s > gunicorn's --graceful-timeout 25, so an in-flight
    # upload finishes instead of being SIGKILLed after the default 10 s and leaving
    # 'interrupted by restart' rows and orphans behind.
    init: true
    stop_grace_period: 30s
    # 1g: rendering/converting a large PDF upload was OOM-killed at 384m.
    mem_limit: 1g
    mem_reservation: 128m
    oom_score_adj: -500
    depends_on:
      calibre-web:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - PYTHONFAULTHANDLER=1          # a fatal signal (SIGBUS/SIGSEGV) logs a Python traceback
      - DOMAIN=${DOMAIN}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}  # gets a mail when a request awaits approval (needs SMTP)
      - MAX_REQUESTS_PER_DAY=${MAX_REQUESTS_PER_DAY:-30}
      - KOSYNC_ENABLED=${KOSYNC_ENABLED:-false}
      # Abuse controls and session length. These were only in librarian/config.py, so tightening
      # them after an attack — or loosening them because the household kept locking itself out —
      # meant editing this file, which every Deploy overwrites from the checkout. .env wins.
      - LOCKOUT_FAILS=${LOCKOUT_FAILS:-5}            # failed logins per user+IP ...
      - LOCKOUT_WINDOW=${LOCKOUT_WINDOW:-900}        # ... within this many seconds ...
      - LOCKOUT_SECONDS=${LOCKOUT_SECONDS:-900}      # ... lock that pair for this long
      - LOCKOUT_IP_FAILS=${LOCKOUT_IP_FAILS:-20}     # any usernames from one IP (a family shares one)
      - SESSION_HOURS=${SESSION_HOURS:-12}
      # The disk watchdog's thresholds (scripts/disk-watch.sh owns the behaviour); the portal
      # reads them so it can explain a pause instead of just stopping.
      - DISK_WARN_PCT=${DISK_WARN_PCT:-85}
      - DISK_STOP_PCT=${DISK_STOP_PCT:-95}
      - DISK_RESUME_PCT=${DISK_RESUME_PCT:-80}
      - LIBRARIAN_SECRET=${LIBRARIAN_SECRET}
      - CWA_DB=/cwa/app.db
      - LIBRARY_DIR=/calibre-library
      # Outgoing mail for the portal's Send-to-Kindle (menu "Mail"). Blank = feature hidden.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - KINDLE_MAX_MB=${KINDLE_MAX_MB:-45}   # Amazon rejects bigger attachments
      - STATE_DB=/state/librarian.db
      - INGEST_DIR=/ingest
      - STAGING_DIR=/staging
      - AUDIO_DIR=/audiobooks
      - SRC_GUTENBERG=${SRC_GUTENBERG:-true}
      - SRC_STANDARD=${SRC_STANDARD:-false}   # its feed now needs a Patrons Circle login
      - SRC_ARCHIVE=${SRC_ARCHIVE:-true}
      - SRC_LIBRIVOX=${SRC_LIBRIVOX:-true}
      - IA_COLLECTIONS=${IA_COLLECTIONS:-gutenberg,opensource,americana,cdl}
      - SRC_MYCATALOG=${SRC_MYCATALOG:-false}
      - MYCATALOG_NAME=${MYCATALOG_NAME:-My catalog}
      - MYCATALOG_URL=${MYCATALOG_URL:-}
      - MYCATALOG_USER=${MYCATALOG_USER:-}
      - MYCATALOG_PASS=${MYCATALOG_PASS:-}
      - ABS_URL=http://127.0.0.1:13378
      - ABS_TOKEN=${ABS_TOKEN:-}
      - ABS_LIBRARY_NAME=${ABS_LIBRARY_NAME:-Audiobooks}
      - APPROVALS_REQUIRED=${APPROVALS_REQUIRED:-false}   # family default; Configure explains
      - NOTIFY_WEBHOOK=${NOTIFY_WEBHOOK:-}
      - NOTIFY_WEBHOOK_FORMAT=${NOTIFY_WEBHOOK_FORMAT:-auto}   # auto = ntfy style when the URL host contains 'ntfy'
      - AUTHELIA_ENABLED=${AUTHELIA_ENABLED:-false}           # portal hides self-service user creation when the gate is on
      - TORRENTS_ENABLED=${TORRENTS_ENABLED:-false}           # shows the qBittorrent admin link
      - DEDUPE_WARN=${DEDUPE_WARN:-true}
      - ENRICH_METADATA=${ENRICH_METADATA:-true}
      - CALIBRE_DB=/calibre-library/metadata.db
      - DROPBOX_DIR=/dropbox
      - INTAKE_TOKEN=${INTAKE_TOKEN:-}
      # Cloudflare Free/Pro reject request bodies over 100 MB at the edge; bigger files go
      # through the user's dropbox.
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-95}
      - GUTENBERG_MIRROR=${GUTENBERG_MIRROR:-}
      - MAX_EBOOK_MB=${MAX_EBOOK_MB:-200}     # worker download caps per kind (SSRF/abuse fence)
      - MAX_AUDIO_MB=${MAX_AUDIO_MB:-2048}
      - MAX_PDF_MB=${MAX_PDF_MB:-250}         # PDFs above this are not tagged in memory (parked for users)
      - IMAP_ALLOWED_SENDERS=${IMAP_ALLOWED_SENDERS:-}   # blank = sender must be the user's own e-mail
      - IMAP_HOST=${IMAP_HOST:-}
      - IMAP_PORT=${IMAP_PORT:-0}
      - IMAP_SSL=${IMAP_SSL:-true}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASS=${IMAP_PASS:-}
      - IMAP_FOLDER=${IMAP_FOLDER:-INBOX}
      - IMAP_DEFAULT_USER=${IMAP_DEFAULT_USER:-}
      - IMAP_REQUIRE_AUTH=${IMAP_REQUIRE_AUTH:-true}   # file mail only when DMARC/DKIM/SPF pass (off for a local relay)
    volumes:
      # CWA's config dir. The portal authenticates against app.db and performs a few
      # well-defined writes to it (users, Kindle address, Kobo token — see librarian/cwa.py).
      # app.db runs in WAL mode, so the whole directory is mounted (sidecar files) and it
      # must be writable. Everything else in the portal opens it read-only.
      - ./cwa/config:/cwa
      - ./librarian/state:/state
      - ./library/ingest:/ingest
      - ./library/staging:/staging
      - ./library/audiobooks:/audiobooks
      - ./library/books:/calibre-library:ro
      - ./library/dropbox:/dropbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Listens on 127.0.0.1:8090; Caddy serves it at request.<domain>

  shelfmark:
    <<: *common
    # Shelfmark (formerly "Calibre-Web Automated Book Downloader", the CWA companion):
    # a multi-source search + download UI. Users sign in with their Calibre-Web account.
    # Everything it downloads lands in THAT user's dropbox, where the librarian tags it
    # owner:<user> and ingests it atomically (ebooks -> Calibre-Web, audiobooks -> Audiobookshelf
    # with the owner tag), so per-user isolation is preserved end to end.
    # Which release sources are enabled is chosen by the admin in Shelfmark's Settings.
    image: ${IMG_SHELFMARK:-ghcr.io/calibrain/shelfmark:v1.3.7}
    container_name: shelfmark
    # Fail closed: Shelfmark silently falls back to auth mode "none" (no login at all, everyone
    # admin) when CWA's app.db is missing or unreadable at start. Refuse to start unless the
    # file exists and the run-as user can read a SQLite header from it; restart: unless-stopped
    # retries every few seconds until it can. The image's own entrypoint is then exec'd
    # unchanged (keep in step with the image: ENTRYPOINT dumb-init --, CMD /app/entrypoint.sh).
    entrypoint:
      - /bin/sh
      - -c
      - |
        if ! gosu "$${PUID:-1000}:$${PGID:-1000}" head -c 16 /auth/app.db 2>/dev/null | grep -q '^SQLite format 3'; then
          echo "shelfmark: /auth/app.db (Calibre-Web's user database) is missing or unreadable; refusing to start without authentication" >&2
          sleep 10; exit 1
        fi
        exec /usr/bin/dumb-init -- /app/entrypoint.sh
    mem_limit: 768m
    mem_reservation: 128m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKERMODE=true
      - SESSION_COOKIE_SECURE=true
      # Log in with Calibre-Web accounts (CWA admins are Shelfmark admins). Read-only mount.
      - AUTH_METHOD=cwa
      - CWA_DB_PATH=/auth/app.db
      # Where downloads land. The per-user level is written into the NAMING TEMPLATES, not
      # into the destination path, for two reasons (both verified in
      # ghcr.io/calibrain/shelfmark:v1.3.7):
      #  * the image's entrypoint runs `make_writable "${INGEST_DIR:-/books}"` -> `mkdir -p`
      #    on the RAW value (/app/entrypoint.sh:481), so a destination of "/dropbox/{User}"
      #    created a literal folder named "{User}" in the dropbox root at every start, which
      #    the librarian then logged as "not an existing user's folder; ignored". With
      #    INGEST_DIR=/dropbox it only touches the real mount.
      #  * only "organize" mode may contain path separators, and only it keeps a multi-file
      #    audiobook together: "rename" renames single-file downloads and drops multi-file
      #    downloads flat under their original names (download/postprocess/transfer.py), so
      #    a 3-part audiobook became 3 separate Audiobookshelf items.
      # INGEST_DIR is the ONLY env name for the books destination: the setting is called
      # DESTINATION but declares env_var="INGEST_DIR" (config/settings.py), so an env var
      # named DESTINATION is ignored. DESTINATION_AUDIOBOOK is its own key and is read as-is.
      # {User} = the signed-in CWA username, sanitised by Shelfmark (no "/", no "..").
      - INGEST_DIR=/dropbox
      - FILE_ORGANIZATION=organize
      # -> /dropbox/<user>/<Author> - <Title> (<Year>).epub, i.e. exactly what the previous
      # rename template produced, plus " - Part NN" when a download really has several files.
      - TEMPLATE_ORGANIZE={User}/{Author} - {Title} ({Year}){ - Part }{PartNumber}
      # Audiobooks take the same route: into the user's dropbox, where the librarian moves
      # them into Audiobookshelf tagged owner:<user>. Never straight to /audiobooks.
      - DESTINATION_AUDIOBOOK=/dropbox
      - FILE_ORGANIZATION_AUDIOBOOK=organize
      # -> ONE top-level folder per audiobook:
      #    /dropbox/<user>/<Author> - <Title>/<Title> - Part 01.mp3, ... - Part 02.mp3, ...
      # so the librarian's dropbox watcher sees a single book instead of one item per file.
      # A single-file audiobook gets the same folder with one file in it.
      - TEMPLATE_AUDIOBOOK_ORGANIZE={User}/{Author} - {Title}/{Title}{ - Part }{PartNumber}
      - BOOK_LANGUAGE=${SHELFMARK_LANGUAGE:-en}
      - SEARCH_PAGE_TITLE=${SHELFMARK_TITLE:-Library search}
      - MAX_CONCURRENT_DOWNLOADS=${SHELFMARK_CONCURRENCY:-1}
      - CALIBRE_WEB_URL=https://books.${DOMAIN}
      - AUDIOBOOK_LIBRARY_URL=https://audio.${DOMAIN}
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      calibre-web:
        condition: service_healthy
    volumes:
      - ./shelfmark/config:/config
      - ./library/dropbox:/dropbox
      # Read access to the library keeps Shelfmark's "already in library" link working.
      - ./library/audiobooks:/audiobooks:ro
      - ./cwa/config:/auth:ro
    healthcheck:
      # Unhealthy unless Shelfmark reports Calibre-Web authentication (it re-resolves the mode
      # per request, so a vanished app.db later would flip it to "none"); selftest checks too.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8084/api/auth/check | grep -q '\"auth_mode\": *\"cwa\"'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Caddy serves it at shelf.<domain> (public, behind Cloudflare + optional Authelia)

  uptime-kuma:
    <<: *common
    # Stay on the 1.x line: 2.x needs a database migration.
    image: ${IMG_KUMA:-louislam/uptime-kuma:1}
    container_name: uptime-kuma
    # Host network, listening on loopback only, so monitors such as
    # http://127.0.0.1:8090/healthz and http://127.0.0.1:8084/api/health reach the services
    # (on a bridge network 127.0.0.1 would be Kuma's own container).
    network_mode: host
    mem_limit: 384m
    environment:
      - UPTIME_KUMA_HOST=127.0.0.1
      - UPTIME_KUMA_PORT=3001
      - TZ=${TZ}
    volumes:
      - ./kuma/data:/app/data
    # Reached only over Tailscale at monitor.<domain>
