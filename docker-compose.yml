# Hardened book library stack. Managed by bookstack.sh — you rarely need to touch this.
#
# Network model
#   caddy            host network: public sites listen on BIND_IP (books, audio, request, shelf,
#                    auth; firewall admits only Cloudflare), admin sites (monitor, dl, ephemera)
#                    on the default listener but abort anything not from the tailnet (Caddyfile
#                    tailnet_only), so a missing tailnet IP can never stop the public sites.
#   librarian,       host network too (librarian: loopback to CWA/ABS, Caddy upstream;
#   uptime-kuma      Kuma: so its http://127.0.0.1:<port> monitors reach the services).
#                    Host-network processes can reach the admin's other tailnet devices when the
#                    tailnet policy allows it: the portal's download fence refuses 100.64.0.0/10
#                    and private ranges, and the Tailscale step should apply the tailnet ACL that
#                    gives this machine (tag:bookstack) no outbound access.
#   everything else  bound to 127.0.0.1 only; reachable solely through Caddy. Each sits on a
#                    network of its own (L01): cwa, abs, dl, fetch (Shelfmark + FlareSolverr), plus
#                    auth (Authelia) and eph (Ephemera + FlareSolverr) in the overlays. Shelfmark,
#                    the internet-facing third-party app, cannot open a connection to Calibre-Web,
#                    Audiobookshelf, qBittorrent or Authelia; the host-network services reach
#                    every one of them on its 127.0.0.1 port, as before.
#   qbittorrent      OPT-IN (profile "torrents", Library -> Torrents). Additionally opens 6881
#                    to the internet for peer traffic (that's all it exposes). Written as
#                    0.0.0.0:6881 on purpose: the Docker daemon's default publish address is
#                    127.0.0.1 (daemon.json, bookstack.sh step_system).
#
# Images are pinned through IMG_* in .env (bookstack.sh seeds them; Operations -> Update bumps
# them). The defaults here are the tags current on 2026-09-22, so compose renders with an
# empty .env too. Memory/PID fences are sized for a 4 GB host (README: on 8 GB multiply by 1.5).

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:

  caddy:
    <<: *common
    build: ./caddy
    image: bookstack/caddy:latest
    container_name: caddy
    network_mode: host
    mem_limit: 256m
    oom_score_adj: -500
    environment:
      # Least privilege: only the Zone:DNS:Edit token for ACME DNS-01 (CF_DNS_TOKEN; the
      # installer writes a copy of the main token when no separate one was given). The main
      # CF_API_TOKEN (zone settings, rules, firewall) stays on the host. The fallback keeps an
      # older .env without CF_DNS_TOKEN renewing certificates until Configure runs again.
      - CF_API_TOKEN=${CF_DNS_TOKEN:-${CF_API_TOKEN:-}}
      # L05: added to requests the Authelia gate let through (authelia/caddy-gate.snippet)
      - BOOKSTACK_GATE_SECRET=${GATE_SECRET:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/cf-origin-pull-ca.pem:/etc/caddy/cf-origin-pull-ca.pem:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    # Admin API lives on unix//run/caddy-admin.sock inside the container (Caddyfile global
    # options); nothing listens on 127.0.0.1:2019.

  calibre-web:
    <<: *common
    image: ${IMG_CWA:-crocodilestick/calibre-web-automated:v4.0.6}
    container_name: calibre-web
    # Calibre conversions fork several processes and peak high; the largest fence in the stack.
    pids_limit: 1024
    mem_limit: 1600m
    mem_reservation: 512m
    # L01: s6/gosu start as root to drop to PUID; these five capabilities are all that needs
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    networks: { cwa: {} }
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - ./cwa/config:/config
      - ./library/ingest:/cwa-book-ingest
      - ./library/books:/calibre-library
    # The image ships a healthcheck (curl on :8083, 120 s start period). The portal and
    # Shelfmark authenticate against CWA's app.db, so they wait for it to be healthy —
    # Shelfmark in particular would run WITHOUT authentication if app.db did not exist yet.

  audiobookshelf:
    <<: *common
    image: ${IMG_ABS:-ghcr.io/advplyr/audiobookshelf:2.36.1}
    container_name: audiobookshelf
    user: "${PUID}:${PGID}"
    mem_limit: 768m
    mem_reservation: 256m
    cap_drop: [ALL]                # L01: runs as PUID from the first instruction; needs none
    networks: { abs: {} }
    environment:
      - TZ=${TZ}
      # Keep Node's heap under the container fence so a big library scan GCs instead of OOMing.
      - NODE_OPTIONS=--max-old-space-size=640
    ports:
      - "127.0.0.1:13378:80"
    volumes:
      - ./library/audiobooks:/audiobooks
      - ./library/podcasts:/podcasts
      - ./abs/config:/config
      - ./abs/metadata:/metadata
    healthcheck:
      # GET /healthcheck is a bare 200 in 2.36.1 (server/Server.js: router.get('/healthcheck',
      # (req, res) => res.sendStatus(200))) and needs no token. The image has no curl, but it
      # does ship /usr/bin/wget (both verified in ghcr.io/advplyr/audiobookshelf:2.36.1).
      # ABS listens on port 80 inside the container (published on 127.0.0.1:13378).
      # /healthcheck is a constant 200 that touches neither the database nor the library
      # (server/Server.js: res.sendStatus(200)), so it can only fail when the process is dead.
      # /status reports real state; "isInit":true is what scripts/selftest.sh already asserts,
      # and it goes through the database, so a corrupt absdatabase.sqlite now shows as unhealthy.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/status | grep -q '\"isInit\":true'"]
      interval: 60s
      timeout: 10s
      retries: 3
      # A first scan of a big library keeps the event loop busy; don't flap during it.
      start_period: 60s

  qbittorrent:
    <<: *common
    # Opt-in: only started with `--profile torrents` (bookstack.sh adds it when
    # TORRENTS_ENABLED=true). It sees ONLY the user dropboxes: every finished download must sit
    # in a category whose save path is /dropbox/<cwa-user>, so the portal tags it owner:<user>
    # and ingests it (ebooks -> Calibre-Web, audiobooks -> Audiobookshelf). No direct mounts of
    # ingest/audiobooks/staging: those bypass owner tagging.
    profiles: ["torrents"]
    image: ${IMG_QBIT:-lscr.io/linuxserver/qbittorrent:5.2.3}
    container_name: qbittorrent
    mem_limit: 512m
    mem_reservation: 128m
    # L01: s6/gosu start as root to drop to PUID; these five capabilities are all that needs
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    networks: { dl: {} }
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    ports:
      - "127.0.0.1:8080:8080"
      - "0.0.0.0:6881:6881"
      - "0.0.0.0:6881:6881/udp"
    volumes:
      - ./qbt/config:/config
      - ./downloads/incomplete:/downloads/incomplete
      - ./library/dropbox:/dropbox

  librarian:
    <<: *common
    build:
      context: ./librarian
      args:
        # Baked into the image (ARG + ENV) so /healthz and /admin can show which checkout the
        # running portal was built from: a stale image is otherwise invisible. Deploy/Update
        # pass the git hash; a plain `docker compose build` gets "dev".
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: bookstack/librarian:latest
    container_name: librarian
    # Host network: reaches Audiobookshelf on 127.0.0.1 and is proxied by Caddy on 127.0.0.1.
    network_mode: host
    user: "${PUID}:${PGID}"
    # Graceful shutdown. The image's CMD now execs gunicorn (librarian/Dockerfile), so the
    # signal reaches it; init: true additionally puts docker-init (tini) at PID 1, which
    # reaps the short-lived children the worker forks (calibre/ffmpeg probes) instead of
    # leaving them to gunicorn. 30 s > gunicorn's --graceful-timeout 25, so an in-flight
    # upload finishes instead of being SIGKILLed after the default 10 s and leaving
    # 'interrupted by restart' rows and orphans behind.
    init: true
    stop_grace_period: 30s
    # 1g: rendering/converting a large PDF upload was OOM-killed at 384m.
    mem_limit: 1g
    mem_reservation: 128m
    oom_score_adj: -500
    depends_on:
      calibre-web:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - PYTHONFAULTHANDLER=1          # a fatal signal (SIGBUS/SIGSEGV) logs a Python traceback
      - DOMAIN=${DOMAIN}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}  # gets a mail when a request awaits approval (needs SMTP)
      - MAX_REQUESTS_PER_DAY=${MAX_REQUESTS_PER_DAY:-30}
      - WANTED_MAX_PER_USER=${WANTED_MAX_PER_USER:-25}
      - WANTED_DAYS=${WANTED_DAYS:-180}
      - BOOK_LANGUAGE=${SHELFMARK_LANGUAGE:-en}          # default reading language (Devices changes a reader's own)
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}   # optional metadata source (Library -> Metadata sources)
      # L16: the portal reads and decides Shelfmark's pending requests as this CWA admin account
      - TURNSTILE_SITEKEY=${TURNSTILE_SITEKEY:-}    # L17, optional: Security -> Login bot check
      - CANARY_USERS=${CANARY_USERS:-}              # L08: the canary journey's hidden accounts
      - GATE_SECRET=${GATE_SECRET:-}                # L05: Remote-User is trusted only beside it
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - SHELFMARK_API=http://127.0.0.1:8084
      - SHELFMARK_SVC_USER=${SHELFMARK_SVC_USER:-}
      - SHELFMARK_SVC_PASS=${SHELFMARK_SVC_PASS:-}
      - SHELFMARK_AUTH_METHOD=${SHELFMARK_AUTH_METHOD:-cwa}   # L05: proxy behind the gate
      - ABS_OIDC_SECRET=${ABS_OIDC_SECRET:-}               # L05: Audiobookshelf's client at Authelia
      - HARDCOVER_API_KEY=${HARDCOVER_API_KEY:-}
      - CONVERT_MAX_PER_DAY=${CONVERT_MAX_PER_DAY:-10}      # on-demand conversions per reader per day
      - MAX_UPLOAD_TAILNET_MB=${MAX_UPLOAD_TAILNET_MB:-2048} # L18: upload.<domain> (Tailscale only)
      - KOSYNC_ENABLED=${KOSYNC_ENABLED:-false}
      # Abuse controls and session length. These were only in librarian/config.py, so tightening
      # them after an attack — or loosening them because the household kept locking itself out —
      # meant editing this file, which every Deploy overwrites from the checkout. .env wins.
      - LOCKOUT_FAILS=${LOCKOUT_FAILS:-5}            # failed logins per user+IP ...
      - LOCKOUT_WINDOW=${LOCKOUT_WINDOW:-900}        # ... within this many seconds ...
      - LOCKOUT_SECONDS=${LOCKOUT_SECONDS:-900}      # ... lock that pair for this long
      - LOCKOUT_IP_FAILS=${LOCKOUT_IP_FAILS:-20}     # any usernames from one IP (a family shares one)
      - SESSION_HOURS=${SESSION_HOURS:-12}
      # The disk watchdog's thresholds (scripts/disk-watch.sh owns the behaviour); the portal
      # reads them so it can explain a pause instead of just stopping.
      - DISK_WARN_PCT=${DISK_WARN_PCT:-85}
      - DISK_STOP_PCT=${DISK_STOP_PCT:-95}
      - DISK_RESUME_PCT=${DISK_RESUME_PCT:-80}
      - LIBRARIAN_SECRET=${LIBRARIAN_SECRET}
      - CWA_DB=/cwa/app.db
      - LIBRARY_DIR=/calibre-library
      # Outgoing mail for the portal's Send-to-Kindle (menu "Mail"). Blank = feature hidden.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - KINDLE_MAX_MB=${KINDLE_MAX_MB:-45}   # Amazon rejects bigger attachments
      - STATE_DB=/state/librarian.db
      - INGEST_DIR=/ingest
      - STAGING_DIR=/staging
      - AUDIO_DIR=/audiobooks
      - SRC_GUTENBERG=${SRC_GUTENBERG:-true}
      - SRC_STANDARD=${SRC_STANDARD:-true}    # search feed needs a login; downloads are public (book pages)
      - SRC_ARCHIVE=${SRC_ARCHIVE:-true}
      - SRC_LIBRIVOX=${SRC_LIBRIVOX:-true}
      - IA_COLLECTIONS=${IA_COLLECTIONS:-gutenberg,opensource,americana,cdl}
      - SRC_MYCATALOG=${SRC_MYCATALOG:-false}
      - MYCATALOG_NAME=${MYCATALOG_NAME:-My catalog}
      - MYCATALOG_URL=${MYCATALOG_URL:-}
      - MYCATALOG_USER=${MYCATALOG_USER:-}
      - MYCATALOG_PASS=${MYCATALOG_PASS:-}
      - ABS_URL=http://127.0.0.1:13378
      - ABS_TOKEN=${ABS_TOKEN:-}
      - ABS_LIBRARY_NAME=${ABS_LIBRARY_NAME:-Audiobooks}
      - APPROVALS_REQUIRED=${APPROVALS_REQUIRED:-false}   # family default; Configure explains
      - NOTIFY_WEBHOOK=${NOTIFY_WEBHOOK:-}
      - NOTIFY_WEBHOOK_FORMAT=${NOTIFY_WEBHOOK_FORMAT:-auto}   # auto = ntfy style when the URL host contains 'ntfy'
      - AUTHELIA_ENABLED=${AUTHELIA_ENABLED:-false}           # portal hides self-service user creation when the gate is on
      - TORRENTS_ENABLED=${TORRENTS_ENABLED:-false}           # shows the qBittorrent admin link
      - EPHEMERA_ENABLED=${EPHEMERA_ENABLED:-false}          # shows the Ephemera admin link
      - DEDUPE_WARN=${DEDUPE_WARN:-true}
      - ENRICH_METADATA=${ENRICH_METADATA:-true}
      - CALIBRE_DB=/calibre-library/metadata.db
      - DROPBOX_DIR=/dropbox
      - INTAKE_TOKEN=${INTAKE_TOKEN:-}
      # Cloudflare Free/Pro reject request bodies over 100 MB at the edge; bigger files go
      # through the user's dropbox.
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-95}
      # NOT MAX_UPLOAD_MB: a browser upload is streamed to disk, a mailed message is parsed in
      # memory at roughly a dozen times the attachment, which OOM-killed the whole portal.
      - MAX_MAIL_MB=${MAX_MAIL_MB:-40}
      - GUTENBERG_MIRROR=${GUTENBERG_MIRROR:-}
      - MAX_EBOOK_MB=${MAX_EBOOK_MB:-200}     # worker download caps per kind (SSRF/abuse fence)
      - MAX_AUDIO_MB=${MAX_AUDIO_MB:-2048}
      - MAX_PDF_MB=${MAX_PDF_MB:-250}         # PDFs above this are not tagged in memory (parked for users)
      - IMAP_ALLOWED_SENDERS=${IMAP_ALLOWED_SENDERS:-}   # blank = sender must be the user's own e-mail
      - IMAP_HOST=${IMAP_HOST:-}
      - IMAP_PORT=${IMAP_PORT:-0}
      - IMAP_SSL=${IMAP_SSL:-true}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASS=${IMAP_PASS:-}
      - IMAP_FOLDER=${IMAP_FOLDER:-INBOX}
      - IMAP_DEFAULT_USER=${IMAP_DEFAULT_USER:-}
      - IMAP_REQUIRE_AUTH=${IMAP_REQUIRE_AUTH:-true}   # file mail only when DMARC/DKIM/SPF pass (off for a local relay)
    volumes:
      # CWA's config dir. The portal authenticates against app.db and performs a few
      # well-defined writes to it (users, Kindle address, Kobo token — see librarian/cwa.py).
      # app.db runs in WAL mode, so the whole directory is mounted (sidecar files) and it
      # must be writable. Everything else in the portal opens it read-only.
      - ./cwa/config:/cwa
      - ./librarian/state:/state
      - ./library/ingest:/ingest
      - ./library/staging:/staging
      - ./library/audiobooks:/audiobooks
      - ./library/books:/calibre-library:ro
      - ./library/dropbox:/dropbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz',timeout=5).status==200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Listens on 127.0.0.1:8090; Caddy serves it at request.<domain>

  shelfmark:
    <<: *common
    # Shelfmark (formerly "Calibre-Web Automated Book Downloader", the CWA companion):
    # a multi-source search + download UI. Users sign in with their Calibre-Web account.
    # Everything it downloads lands in THAT user's dropbox, where the librarian tags it
    # owner:<user> and ingests it atomically (ebooks -> Calibre-Web, audiobooks -> Audiobookshelf
    # with the owner tag), so per-user isolation is preserved end to end.
    # Which release sources are enabled is chosen by the admin in Shelfmark's Settings.
    #
    # OUTBOUND SSRF SURFACE — the tailnet ACL is load-bearing, not optional.
    # GET /api/covers/<id>?url=<base64url> is @login_required only: on a cache miss
    # main.py:api_cover base64-decodes the CALLER'S url and fetches it
    # (core/image_cache.py ImageCacheService._prepare_safe_url). That guard rejects only
    # `ip.is_private or ip.is_loopback or ip.is_link_local or ip.is_reserved`. Measured inside
    # the pinned v1.3.15 image (Python 3.14.7): 169.254.169.254 and 172.17.0.1 are BLOCKED,
    # but 100.64.1.5 is private=False loopback=False link_local=False reserved=False, i.e.
    # ALLOWED — the whole Tailscale CGNAT range 100.64.0.0/10 is not fenced. Redirects ARE
    # re-checked, so the hole is the range, not the redirect handling. v1.3.15 did not fix it
    # (re-verified this round); re-check whenever IMG_SHELFMARK is bumped.
    # The portal's own fence does block it — see librarian/worker.py::_check_target,
    # `CGNAT = ipaddress.ip_network("100.64.0.0/10")  # Tailscale addresses live here` — so
    # this stack has already decided that range is in scope and Shelfmark simply does not
    # implement it. Caddy cannot help: this is outbound.
    # What contains it: the tailnet ACL from the Tailscale step must give this machine
    # (tag:bookstack) NO outbound access to other tailnet nodes. scripts/selftest.sh now
    # probes that from inside this container instead of assuming it (see "tailnet ACL").
    # The alternative, if the ACL cannot be relied on, is to turn the cover cache off
    # entirely (COVERS_CACHE_ENABLED in Shelfmark's Settings) at the cost of cover latency —
    # recorded in docs/DECISIONS-PENDING.md.
    image: ${IMG_SHELFMARK:-ghcr.io/calibrain/shelfmark:v1.3.15}
    container_name: shelfmark
    # Fail closed: Shelfmark silently falls back to auth mode "none" (no login at all, everyone
    # admin) when CWA's app.db is missing or unreadable at start. Refuse to start unless the
    # file exists and the run-as user can read a SQLite header from it; restart: unless-stopped
    # retries every few seconds until it can. The image's own entrypoint is then exec'd
    # unchanged (keep in step with the image: ENTRYPOINT dumb-init --, CMD /app/entrypoint.sh).
    entrypoint:
      - /bin/sh
      - -c
      - |
        if ! gosu "$${PUID:-1000}:$${PGID:-1000}" head -c 16 /auth/app.db 2>/dev/null | grep -q '^SQLite format 3'; then
          echo "shelfmark: /auth/app.db (Calibre-Web's user database) is missing or unreadable; refusing to start without authentication" >&2
          sleep 10; exit 1
        fi
        exec /usr/bin/dumb-init -- /app/entrypoint.sh
    mem_limit: 768m
    mem_reservation: 128m
    # L01: gosu drops to PUID; these five capabilities are all the entrypoint needs. On `fetch`
    # with FlareSolverr only: Shelfmark cannot open a connection to any other service.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    networks: { fetch: {} }
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DOCKERMODE=true
      - SESSION_COOKIE_SECURE=true
      # Log in with Calibre-Web accounts (CWA admins are Shelfmark admins). Read-only mount.
      # L05: "proxy" while the Authelia gate is on — one login: Caddy strips Remote-User/Groups
      # on every path and sets them from Authelia's answer, and nothing but FlareSolverr shares
      # Shelfmark's network. The same accounts are taken over by username (measured on v1.3.15:
      # cwa -> proxy -> cwa keeps every user id), admin comes ONLY from the "admins" group.
      - AUTH_METHOD=${SHELFMARK_AUTH_METHOD:-cwa}
      - PROXY_AUTH_USER_HEADER=Remote-User
      - PROXY_AUTH_ADMIN_GROUP_HEADER=Remote-Groups
      - PROXY_AUTH_ADMIN_GROUP_NAME=admins
      - PROXY_AUTH_LOGOUT_URL=https://auth.${DOMAIN:-localhost}/logout
      - PROXY_AUTH_RESTRICT_SETTINGS_TO_ADMIN=true
      # Seedbox safety (private trackers: strict seeding, no hit-and-run). Pinned here, where the web
      # UI cannot change them (an env value always wins; measured on v1.3.15): after an import
      # Shelfmark leaves the torrent in rTorrent untouched and the job in SABnzbd in place. It never
      # removes a torrent on a cancel or failure anyway (hard rule in its code); a cancelled or
      # failed Usenet job it added is deleted, which Usenet (no seeding) does not mind.
      - PROWLARR_TORRENT_ACTION=keep
      - PROWLARR_USENET_ACTION=copy
      - CWA_DB_PATH=/auth/app.db
      # Where downloads land. The per-user level is written into the NAMING TEMPLATES, not
      # into the destination path, for two reasons (both re-verified on the pinned
      # ghcr.io/calibrain/shelfmark:v1.3.15, and on v1.3.7 side by side: identical output):
      #  * the image's entrypoint runs `make_writable "${INGEST_DIR:-/books}"` -> `mkdir -p`
      #    on the RAW value (/app/entrypoint.sh:481), so a destination of "/dropbox/{User}"
      #    created a literal folder named "{User}" in the dropbox root at every start, which
      #    the librarian then logged as "not an existing user's folder; ignored". With
      #    INGEST_DIR=/dropbox it only touches the real mount.
      #  * only "organize" mode may contain path separators, and only it can put the {User}
      #    level in the template at all: "rename" renames single-file downloads and drops
      #    multi-file downloads flat under their original names
      #    (download/postprocess/transfer.py), so a 3-part audiobook became 3 separate
      #    Audiobookshelf items. v1.3.12 added a third mode, "rename_and_group", which keeps
      #    a multi-file audiobook in its SOURCE folder name; it is not what this stack wants,
      #    because that name comes from the release, not from the template, and it still
      #    forbids path separators, so there would be no per-user level.
      # INGEST_DIR is the ONLY env name for the books destination: the setting is called
      # DESTINATION but declares env_var="INGEST_DIR" (config/settings.py), so an env var
      # named DESTINATION is ignored. DESTINATION_AUDIOBOOK is its own key and is read as-is.
      # {User} = the signed-in CWA username, sanitised by Shelfmark (no "/", no "..").
      - INGEST_DIR=/dropbox
      - FILE_ORGANIZATION=organize
      # -> /dropbox/<user>/<Author> - <Title> (<Year>).epub, i.e. exactly what the previous
      # rename template produced, plus " - Part NN" when a download really has several files.
      - TEMPLATE_ORGANIZE={User}/{Author} - {Title} ({Year}){ - Part }{PartNumber}
      # Audiobooks take the same route: into the user's dropbox, where the librarian moves
      # them into Audiobookshelf tagged owner:<user>. Never straight to /audiobooks.
      - DESTINATION_AUDIOBOOK=/dropbox
      - FILE_ORGANIZATION_AUDIOBOOK=organize
      # -> ONE top-level folder per audiobook:
      #    /dropbox/<user>/<Author> - <Title>/<Title> - Part 01.mp3, ... - Part 02.mp3, ...
      # so the librarian's dropbox watcher sees a single book instead of one item per file.
      # A single-file audiobook gets the same folder with one file in it.
      - TEMPLATE_AUDIOBOOK_ORGANIZE={User}/{Author} - {Title}/{Title}{ - Part }{PartNumber}
      - BOOK_LANGUAGE=${SHELFMARK_LANGUAGE:-en}
      - SEARCH_PAGE_TITLE=${SHELFMARK_TITLE:-Library search}
      - MAX_CONCURRENT_DOWNLOADS=${SHELFMARK_CONCURRENCY:-1}
      # New in v1.3.13 and 300 s by default, which is longer than this stack can deliver:
      # shelf.<domain> is served through Cloudflare, and the Free plan gives up on an origin
      # that has not answered in 100 s with its own error 524 page. Shelfmark's own note says
      # the proxy's read timeout must be at least this value or the search is cut off first.
      # At 300 s a slow search returns a Cloudflare 524 and the user learns nothing; at 90 s
      # Shelfmark answers first and names the real cause (usually a protection challenge
      # nobody could solve). Raise it only together with a Cloudflare plan that allows it.
      - RELEASE_SEARCH_TIMEOUT=${SHELFMARK_SEARCH_TIMEOUT:-90}
      - CALIBRE_WEB_URL=https://books.${DOMAIN}
      - AUDIOBOOK_LIBRARY_URL=https://audio.${DOMAIN}
      # Protection challenges on download sites. With FlareSolverr on (Operations -> FlareSolverr,
      # FLARESOLVERR_ENABLED) they are solved by the shared flaresolverr service below, whose
      # Chromium lives in ITS 1 GiB fence, instead of Shelfmark's built-in bypasser, which starts
      # a Chromium inside this 768 MiB one. Set from the environment on purpose: in the pinned
      # v1.3.15 an env value always wins over the Settings page (core/config.py get(): "Deployment-
      # level ENV values always win"), so the admin UI cannot point Shelfmark at a solver that is
      # not running. EXT_BYPASSER_TIMEOUT stays under RELEASE_SEARCH_TIMEOUT (Cloudflare's 100 s).
      # Metadata-first ("universal") search is Shelfmark's DEFAULT mode, and it has no metadata
      # source unless one is switched on: the pinned v1.3.15 then answers every search with "No
      # metadata provider configured" (measured). Open Library is keyless; Hardcover and Google
      # Books need keys, which Library -> Metadata sources writes into shelfmark/metadata.env
      # (optional file below) — never as empty env values here, because Shelfmark treats an
      # empty env var as SET and would lock the key field blank in its own Settings page.
      - OPENLIBRARY_ENABLED=true
      # L16: Shelfmark obeys the SAME approval rule as the portal. With APPROVALS_REQUIRED a
      # reader picks a file and it waits; the admin approves it on the portal's Pending card
      # (librarian/shelfmark_api.py) and it downloads to that READER's dropbox. Admins bypass.
      - REQUESTS_ENABLED=${APPROVALS_REQUIRED:-false}
      - REQUEST_POLICY_DEFAULT_EBOOK=request_release
      - REQUEST_POLICY_DEFAULT_AUDIOBOOK=request_release
      - USING_EXTERNAL_BYPASSER=${FLARESOLVERR_ENABLED:-false}
      - EXT_BYPASSER_URL=http://flaresolverr:8191
      - EXT_BYPASSER_PATH=/v1
      - EXT_BYPASSER_TIMEOUT=${FLARESOLVERR_TIMEOUT_MS:-60000}
    env_file:
      - path: ./shelfmark/metadata.env
        required: false
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      calibre-web:
        condition: service_healthy
    volumes:
      - ./shelfmark/config:/config
      - ./library/dropbox:/dropbox
      # Read access to the library keeps Shelfmark's "already in library" link working.
      - ./library/audiobooks:/audiobooks:ro
      - ./cwa/config:/auth:ro
      # Library -> Seedbox: finished seedbox downloads are COPIED here (scripts/seedbox-fetch.py);
      # Shelfmark's remote path mappings point at /seedbox and it files each into the reader's dropbox
      - ./library/seedbox:/seedbox
    healthcheck:
      # TWO assertions, because the first one alone is blind in the direction that matters.
      # (a) /api/auth/check reports auth_mode "cwa". This proves Shelfmark STARTED with a
      #     readable app.db and NOTHING MORE: the mode is fixed at process start. Measured on
      #     the pinned ghcr.io/calibrain/shelfmark:v1.3.15:
      #     shelfmark/config/env.py:166 evaluates `CWA_DB_PATH = _resolve_cwa_db_path()` ONCE at
      #     module import, and core/auth_modes.py:80 `if auth_mode == AUTH_SOURCE_CWA and
      #     cwa_db_path:` tests the TRUTHINESS of that cached Path, never its existence. Proven
      #     live: with app.db present /api/auth/check said "cwa" and POST /api/auth/login
      #     answered 401; after `mv app.db app.db.gone` /api/auth/check STILL said "cwa" (this
      #     command still printed healthy) while every login answered 500 "Database
      #     configuration error". So the one regression this check exists to catch — the
      #     ./cwa/config bind-mount lost, app.db renamed by a restore, CWA's config dir wiped —
      #     was exactly the one it could not see.
      # (b) app.db is STILL a readable SQLite file right now. Same test the entrypoint above
      #     makes at start, re-made every interval, as the run-as user (a root-readable file
      #     the app cannot open fails a login just as hard as a missing one). This is the half
      #     that catches the after-start case, and it has no side effects.
      # NOT a login probe: Shelfmark locks an account after 10 failed attempts for 30 minutes
      # and then answers 429 (measured), so a per-minute healthcheck would lock its own probe
      # account and go blind again. scripts/selftest.sh makes that probe instead — once, on
      # demand — where a single attempt can never reach the lockout.
      # $$ so compose leaves the expansion to the container's shell (as in the entrypoint above).
      test: ["CMD-SHELL", "gosu \"$${PUID:-1000}:$${PGID:-1000}\" head -c 16 /auth/app.db 2>/dev/null | grep -q '^SQLite format 3' && curl -sf http://127.0.0.1:8084/api/auth/check | grep -q \"\\\"auth_mode\\\": *\\\"$${AUTH_METHOD:-cwa}\\\"\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Caddy serves it at shelf.<domain> (public, behind Cloudflare + optional Authelia)

  uptime-kuma:
    <<: *common
    # Stay on the 1.x line: 2.x needs a database migration.
    image: ${IMG_KUMA:-louislam/uptime-kuma:1}
    container_name: uptime-kuma
    # Host network, listening on loopback only, so monitors such as
    # http://127.0.0.1:8090/healthz and http://127.0.0.1:8084/api/health reach the services
    # (on a bridge network 127.0.0.1 would be Kuma's own container).
    network_mode: host
    mem_limit: 384m
    environment:
      - UPTIME_KUMA_HOST=127.0.0.1
      - UPTIME_KUMA_PORT=3001
      - TZ=${TZ}
    volumes:
      - ./kuma/data:/app/data
    # Reached only over Tailscale at monitor.<domain>. Its monitors, notification channels and
    # the nightly-reboot maintenance window are created by kuma-bootstrap below, not by hand.

  kuma-bootstrap:
    # One-shot, never a running service (profile "tools": `up` never starts it). bookstack.sh
    # runs it after every Deploy and from Operations -> Monitoring:
    #   docker compose run --rm -T kuma-bootstrap < config.json
    # It creates Kuma's admin account on first run and reconciles the monitors it owns with the
    # features that are switched on (monitoring/kuma_bootstrap.py). Config, including every
    # password, arrives on stdin, never in the environment.
    build: ./monitoring
    image: bookstack/kuma-bootstrap:local
    profiles: ["tools"]
    restart: "no"
    network_mode: host             # Kuma listens on 127.0.0.1:3001 only
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64

  flaresolverr:
    <<: *common
    # Shared protection-challenge solver (headless Chromium): Shelfmark's external bypasser and
    # Ephemera both use it. Profile "solver", which bookstack.sh adds while FLARESOLVERR_ENABLED
    # or EPHEMERA_ENABLED is true (Operations -> FlareSolverr / Ephemera).
    # Measured on the pinned v3.5.2 (2026-09-25): ~50 MiB idle; each open browser 450-500 MiB,
    # returned when the request or session ends (back to ~125 MiB after 20 sequential page
    # loads: no leak); two browsers at once ~910 MiB. The 1 GiB fence therefore allows two
    # simultaneous solves, which is Shelfmark (SHELFMARK_CONCURRENCY=1) plus Ephemera; a third
    # would have its Chromium killed inside this container, never anything else on the box.
    image: ${IMG_FLARESOLVERR:-ghcr.io/flaresolverr/flaresolverr:v3.5.2}
    container_name: flaresolverr
    profiles: ["solver"]
    mem_limit: 1024m
    cap_drop: [ALL]                # L01: runs as its own user; Chromium starts with --no-sandbox
    networks: { fetch: {} }
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    # Loopback only, for Kuma's health monitor (host network). No authentication of its own:
    # nothing on the internet can reach it, and Caddy has no site for it.
    ports:
      - "127.0.0.1:8191:8191"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8191/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

# L01: one network per service (see the header). Nothing on these reaches the host's loopback;
# the host-network services (Caddy, the portal, Kuma) reach each service on its 127.0.0.1 port.
networks:
  cwa: {}
  abs: {}
  dl: {}
  fetch: {}
